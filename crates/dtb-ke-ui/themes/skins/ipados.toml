# iPadOS skin — the pre-Tahoe macOS look on an opaque window.
#
# Structural metrics only; colours come from the active palette. On iOS 26+ the chrome is UIKit
# Liquid Glass (`UIGlassEffect` views beneath gpui's view, see `skin/backdrop.rs`); before that
# there is no glass and `material = "blurred"` steps down to fully opaque surfaces.

material           = "blurred"      # glass on iOS 26+, opaque before (iOS has no window blur)
material-opacity   = 1.0
glass-tint-opacity    = 0.35
glass-backing-opacity = 0.75
glass-tint-opacity-dark    = 0.5
glass-backing-opacity-dark = 0.92
window-decorations = "server"       # UIKit owns the window; we never draw a frame
menu-bar           = "native"       # gpui_ios builds the iPadOS menu bar with UIMenuBuilder
title-bar-height   = 52.0
sidebar-top-padding = 12.0        # air between the native menu bar and the first sidebar row
toolbar-control-height = 32.0   # toolbar capsules and their buttons (36 elsewhere): smaller for touch chrome
radius             = 8.0
radius-lg          = 12.0           # cards, dialogs, popovers
radius-control     = 10.0
control-shape      = "capsule"      # buttons and segmented tracks, as on macOS
focus-ring         = "outline"
selection-style    = "glass-tint"   # accent-tinted rounded row, like the macOS/iPadOS sidebar
shadow             = "soft"
font-family        = ".SystemUIFont"  # gpui_ios maps this to San Francisco
mono-font-family   = "Menlo"
motion-scale       = 1.0
