[package]
name = "dtb-ke-crash"
edition.workspace = true
version.workspace = true
description = "In-process crash capture: on a fault, relaunches this same executable to capture and report a minidump."

[dependencies]
# Signal-safe `fault!` logging on the in-process crash path.
dtb-ke-log.workspace = true
# Ordinary (non-signal-context) logging: macOS's uncaught-`NSException` hook —
# it runs on the throwing thread before AppKit aborts, not inside the signal path `fault!` is for.
log.workspace = true
# Raw minidump structs (`Pwrite`) for the snapshot assembler. Already pulled in by `minidump` below.
minidump-common = "0.27"
scroll = "0.13"

[target.'cfg(not(target_os = "ios"))'.dependencies]
# Reading/digesting minidumps: `writer::build_report`'s digest (every desktop capture path). Portable
# parsing code with no platform restriction of its own — not iOS only because iOS never calls it (its
# own in-process capture assembles a minidump a different way — see `snapshot`/`apple`/`ios`).
minidump = "0.27"
minidump-unwind = { version = "0.27", default-features = false, features = ["framehop"] }
# `block_on` for `minidump-unwind`'s async `walk_stack` (`writer::build_report`).
futures.workspace = true
# Writing minidumps out-of-process. Cross-platform: mach on macOS, `MiniDumpWriteDump` on Windows,
# ptrace/procfs on Linux — none of which apply to iOS's sandboxed in-process capture.
minidump-writer = "0.13"
crash-context = "0.8"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
libc.workspace = true
mach2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Uncaught-`NSException` diagnostics. The app already links these (gpui's own AppKit backend,
# `dtb-ke-ui`'s `skin/backdrop.rs`), so this adds no new code to the shipped binary — just reuses the
# typed `NSException` API instead of hand-rolling `objc_msgSend` bindings.
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSException", "NSObjCRuntime", "NSDictionary"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The signal handler (sigaction / sigaltstack / dlsym + raw syscalls). The heavier minidump-writing
# stack comes in via the target-gated dependencies above.
libc.workspace = true

[lints.rust]
# The Mach FFI layer is broad; not every declaration is wired up yet.
unused = "allow"
