[workspace]
resolver = "3"
# The vendored forks are independent workspace roots (each patched crate carries its own
# `[workspace]`), so they must not be pulled in as automatic path-dependency members.
exclude = ["vendor"]
members = [
    "crates/dtb-ke-crash",
    "crates/dtb-ke-debugger",
    "crates/dtb-ke-export",
    "crates/dtb-ke-log",
    "crates/dtb-ke-persist",
    "crates/dtb-ke-resource",
    "crates/dtb-ke-symbol-server",
    "crates/dtb-ke-symid",
    "crates/dtb-ke-syms",
    "crates/dtb-ke-types",
    "crates/dtb-ke-ui",
    "crates/dtb-ke-util",
]

[workspace.package]
edition = "2024"
version = "2.1.1-dev.0"
license = "AGPL-3.0-or-later"
# Read by `cargo cargo-bundle` (vendor/cargo-bundle) for the .deb Maintainer field and similar —
# previously unset, so it fell back to "Unknown <unknown@localhost>".
authors = ["Philipp Remy <philipp@philippremy.net>"]

[workspace.dependencies]
# Project crates
dtb-ke-crash = { path = "crates/dtb-ke-crash" }
dtb-ke-export = { path = "crates/dtb-ke-export" }
dtb-ke-log = { path = "crates/dtb-ke-log" }
dtb-ke-persist = { path = "crates/dtb-ke-persist" }
dtb-ke-resource = { path = "crates/dtb-ke-resource" }
dtb-ke-symid = { path = "crates/dtb-ke-symid" }
dtb-ke-syms = { path = "crates/dtb-ke-syms" }
dtb-ke-types = { path = "crates/dtb-ke-types" }
dtb-ke-util = { path = "crates/dtb-ke-util" }

# External crates
chrono = { version = "0.4", features = ["serde"] }
comemo = { version = "0.5" }
dirs = { version = "6" }
futures = { version = "0.3" }
# Report transport (`dtb-ke-ui/src/mail.rs`). `chacha20` is already in the tree
# (turso `pure-rust-crypto`); it obfuscates the embedded SMTP credentials build-
# and run-side. `lettre` builds + sends the mail (blocking, rustls — no tokio).
chacha20 = { version = "0.10", default-features = false, features = ["cipher"] }
getrandom = { version = "0.3" }
lettre = { version = "0.11", default-features = false, features = [
    "builder", "smtp-transport", "rustls-tls", "hostname",
] }
gpui-fps = { version = "0.6" }
# One dependency for the whole GPUI stack — bundles gpui, gpui-base (as
# `gpui_kit::base`) and gpui_platform (as `gpui_kit::platform`) so no crate in
# the workspace depends on gpui/gpui-base/gpui_platform directly any more.
# `component` (gpui-component) and `assets` are on by default upstream; we
# roll our own components/assets, so both are turned off.
gpui-kit = { version = "0.6", default-features = false }
# The iOS backend, for its document picker (`gpui_ios::ios::documents`). The same crate gpui_platform
# already pulls in on iOS (see vendor/README.md); named here only to call it directly.
gpui-ios = { package = "gpui-pre-ios", version = "=0.3.6", path = "vendor/zed/crates/gpui_ios" }
image = { version = "0.25", default-features = false }
# Embeds the .ico + VERSIONINFO into the Windows .exe (`dtb-ke-ui/build.rs`).
# Same crate gpui uses for its own resources. It selects the resource compiler
# per target: `rc.exe` (MSVC), `llvm-rc` (building *on* Windows for gnu/gnullvm),
# or `<arch>-w64-mingw32-windres` (cross-compiling to `*-windows-gnu[llvm]` — the
# llvm-mingw toolchain ships that wrapper). Override with `RC_<target>` / `RC`.
embed-resource = { version = "3" }
ooxmlsdk = { version = "0.13" }
# Just for increasing build.rs performance
rayon = { version = "1.12" }
# SVG → PNG rasterisation for the DOCX header logos (re-exports usvg + tiny-skia;
# version tracks the copy Typst/gpui already pull in)
resvg = { version = "0.47" }

# `skin/backdrop.rs` reaches gpui's `NSView` through its `HasWindowHandle` impl.
raw-window-handle = { version = "0.6", default-features = false }

# iPadOS Liquid Glass views (`skin/backdrop.rs`, same version gpui_ios pins)
objc2-ui-kit = { version = "0.3.2", default-features = false, features = [
    "std", "objc2-core-foundation", "UIView", "UIResponder", "UIWindow", "UIColor",
    "UIVisualEffect", "UIVisualEffectView", "UIGlassEffect", "UICornerConfiguration",
    "UICornerRadius", "UITraitCollection", "UIInterface",
] }

# macOS save-panel FFI (matches gpui's objc2 pin)
block2 = { version = "0.6" }
objc2 = { version = "0.6" }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "NSApplication", "NSResponder", "NSPanel", "NSWindow", "NSView",
    "NSControl", "NSButton", "NSButtonCell", "NSCell", "NSPopUpButton",
    "NSMenu", "NSMenuItem", "NSStackView", "NSTextField", "NSText",
    "NSSavePanel", "NSLayoutConstraint", "NSLayoutAnchor", "NSUserInterfaceLayout",
    # `skin/accent.rs`'s system-accent-colour read + `NSAppearance`-scoped
    # resolution.
    "NSColor", "NSColorSpace", "NSAppearance", "objc2-core-foundation", "block2",
    # `skin/backdrop.rs`'s native window backdrop.
    "NSVisualEffectView", "NSGlassEffectView", "NSBox",
    # `skin/app_icon.rs`'s native app-icon fetch (`NSImage` -> `CGImage`,
    # rasterised straight to a BGRA8 buffer via `objc2-core-graphics` — no
    # PNG encode/decode round trip, so the `image` crate's format decoders
    # never need to be linked in for this) + `NSWorkspace`'s notification
    # center, for the private Tahoe+ icon-appearance-changed notification.
    "NSImage", "NSWorkspace", "objc2-core-graphics",
] }
# `skin/app_icon.rs`'s BGRA8 rasterisation of the native app icon (see above).
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std", "CGContext", "CGImage", "CGColorSpace", "CGBitmapContext",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSString", "NSURL", "NSArray", "NSObject", "NSGeometry",
    # `skin/accent.rs`'s `NSSystemColorsDidChangeNotification` observer.
    "NSNotification", "NSOperation", "block2",
] }
# `CGFloat` for `NSColor`'s `getRed:green:blue:alpha:` (skin/accent.rs) —
# objc2-app-kit's own "NSColor"/"objc2-core-foundation" feature only enables
# *generating* the method; naming the type needs a direct dependency.
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "CFCGTypes", "objc2",
] }

# Windows IFileSaveDialog FFI (windows-core is named directly so the
# `#[implement]` macro's `::windows_core` paths resolve; version tracks `windows`)
windows = { version = "0.61", features = [
    "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell",
    "Win32_UI_Shell_Common", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging",
    # `RtlGetVersion` (skin/window.rs's `windows_backdrop_support`) — the real
    # OS build number, since `GetVersionEx` lies without an app manifest.
    "Wdk_System_SystemServices", "Win32_System_SystemInformation",
    # `skin/accent.rs`'s live system-accent-colour read
    # (HKCU\Software\Microsoft\Windows\DWM\AccentColor) + its
    # RegNotifyChangeKeyValue-based watcher.
    "Win32_System_Registry",
] }
windows-core = { version = "0.61.2" }
libc = { version = "0.2" }
log = { version = "0.4" }
# Mach FFI for the crash handler + its helper (macOS only).
mach2 = { version = "0.5" }
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
# In-app updater (`dtb-ke-ui/src/updater/`). `manifest` backend = a static JSON
# on Codeberg (forge-agnostic); `signatures` = mandatory zipsign/ed25519 verify;
# `ureq` (not reqwest) keeps tokio out; `rustls` shares ring with lettre.
self_update = { version = "1.3", default-features = false, features = [
    "manifest", "signatures", "checksums", "ureq", "rustls",
    "compression-tar-gz", "archive-zip", "compression-zip-deflate",
] }
# OS locale detection (`src/i18n.rs`). Already in the tree transitively (pulled
# by cosmic-text, which gpui uses) — promoting it to a direct dependency costs
# ~nothing extra. Normalizes every platform to BCP-47 tags itself, no FFI here.
sys-locale = { version = "0.3" }
thiserror = { version = "2" }
toml = { version = "0.8" }
# `default-features = false` drops turso's `fts` (a full-text search engine —
# tantivy + rust-stemmers + zstd, ~2 MB of binary we never use) and `mimalloc`.
# `turso_core` keeps its own defaults, so the SQL surface we use is unchanged.
turso = { version = "0.7", default-features = false, features = ["pure-rust-crypto"] }
typst = { version = "0.15" }
typst-layout = { version = "0.15" }
typst-pdf = { version = "0.15" }
typst-render = { version = "0.15" }
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
incremental = false
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = "fat" # Enables link-time-optimizations.
opt-level = "z" # Smallest code. gpui / taffy are pinned back to 3 below (hot render path).
panic = "abort" # Higher performance by disabling panic handlers.
debug = "line-tables-only" # debug info, used by the offline symbolication helper (see next line)
split-debuginfo = "packed" # Produces .dsym on Darwin and .dwp on Linux (.pdb for Windows is handled differently, see .cargo/config.toml)
strip = "symbols" # Still strip the whole binary, debug info and symbols stay in the generated external bundle

# The render / event / layout path must be optimized for speed or the UI is
# incredibly slow — pin it back to 3 against the `opt-level = "z"` default above.
[profile.release.package]
gpui-pre = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-apple = { opt-level = 3 }
gpui-pre-macos = { opt-level = 3 }
gpui-pre-ios = { opt-level = 3 }
gpui-base = { opt-level = 3 }
gpui-fps = { opt-level = 3 }
taffy = { opt-level = 3 }
dtb-ke-util = { opt-level = 3 }       # the SIMD pixel-swap for the live preview

# Vendored, patched turso_sdk_kit 0.7.2 (vendor/turso submodule) — see vendor/README.md and
# RUNNERS.md's "Vendored dependency patches" section for why. Upstream's
# build.rs shells out to a bare `windres` with no target-triple prefix,
# which resolves to whichever architecture's copy happens to be first on
# PATH — wrong when cross-compiling to a different architecture than the
# host (confirmed against a real aarch64-pc-windows-gnullvm cross-build
# failure: "machine type x64 conflicts with arm64"). Everything else about
# the crate is untouched — this is a one-line fix, not a fork to maintain
# feature parity on. Remove this patch once a fixed version ships upstream.
[patch.crates-io]
turso_sdk_kit = { path = "vendor/turso/sdk-kit" }

# Vendored backtrace 0.3.76 (see vendor/README.md): the published crate + a one-line patch, moved from `object` 0.37 to
# 0.40. Pulled in by the vendored gpui scheduler.
backtrace = { path = "vendor/backtrace" }

# Vendored taffy (see vendor/README.md): submodule of DioxusLabs/taffy pinned at
# v0.13.0 (what gpui pins with `=0.13.0`); the fork's branch carries the published Cargo.toml.
taffy = { path = "vendor/taffy" }

# Vendored gpui-base (see vendor/README.md): submodule of philippremy/gpui-kit pinned at
# v0.6.6 (the commit 0.6.6 was published from); crates/base carries the published Cargo.toml. Local patch: only blink an input's caret while it has focus.
gpui-base = { path = "vendor/gpui-kit/crates/base" }

# Vendored gpui-kit facade (same submodule as gpui-base, crates/kit; also carries the published
# Cargo.toml). Local patch: `gpui_platform` / `platform::application` are available on iOS like
# on every other platform (upstream excludes iOS and expects a downstream `with_platform`).
gpui-kit = { path = "vendor/gpui-kit/crates/kit" }

# Vendored gpui (see vendor/README.md): the whole gpui-pre* family redirected
# to a git submodule of zed-industries/zed (vendor/zed), pinned at the same
# zed-rev the crates.io gpui-pre 0.3.6 snapshot was built from. Each entry
# below points at the real crate inside vendor/zed, whose manifest the fork's
# dtb-ke-patches branch replaced with the known-good published Cargo.toml (same
# name/version/deps as crates.io) so semver resolution is unaffected. No symlinks:
# Windows checks those out as text files. See vendor/README.md.
gpui-pre = { path = "vendor/zed/crates/gpui" }
gpui-pre-apple = { path = "vendor/zed/crates/gpui_apple" }
gpui-pre-collections = { path = "vendor/zed/crates/collections" }
gpui-pre-derive-refineable = { path = "vendor/zed/crates/refineable/derive_refineable" }
gpui-pre-http-client = { path = "vendor/zed/crates/http_client" }
gpui-pre-linux = { path = "vendor/zed/crates/gpui_linux" }
gpui-pre-macos = { path = "vendor/zed/crates/gpui_macos" }
gpui-pre-macros = { path = "vendor/zed/crates/gpui_macros" }
gpui-pre-perf = { path = "vendor/zed/tooling/perf" }
gpui-pre-platform = { path = "vendor/zed/crates/gpui_platform" }
gpui-pre-refineable = { path = "vendor/zed/crates/refineable" }
gpui-pre-scheduler = { path = "vendor/zed/crates/scheduler" }
gpui-pre-shared-string = { path = "vendor/zed/crates/gpui_shared_string" }
gpui-pre-sum-tree = { path = "vendor/zed/crates/sum_tree" }
gpui-pre-util = { path = "vendor/zed/crates/gpui_util" }
gpui-pre-util-macros = { path = "vendor/zed/crates/util_macros" }
gpui-pre-web = { path = "vendor/zed/crates/gpui_web" }
gpui-pre-wgpu = { path = "vendor/zed/crates/gpui_wgpu" }
gpui-pre-windows = { path = "vendor/zed/crates/gpui_windows" }
gpui-pre-zlog = { path = "vendor/zed/crates/zlog" }
gpui-pre-ztracing = { path = "vendor/zed/crates/ztracing" }
gpui-pre-ztracing-macro = { path = "vendor/zed/crates/ztracing_macro" }
