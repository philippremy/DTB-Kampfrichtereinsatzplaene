name: Release

# A tag `vX.Y.Z` pushed (by scripts/release.py) → a full, signed, notarized
# release, mirrored to both the version tag and the rolling `latest` tag (the
# stable channel's stable URL — see UPDATER.md). Always a clean `target/`
# and the workspace's normal profile (fat LTO) — the opposite of tip.yml's
# speed-over-everything approach. See RUNNERS.md for what each `runs-on`
# label actually is, and tip.yml for the shared conventions (bundling via
# `cargo cargo-bundle`, `scripts/*.py`, the split-debug-info dance for
# Linux/Windows-gnullvm) this file follows without re-explaining them.
#
# "on" is quoted — bare `on:` parses as the *boolean* `true` under YAML 1.1
# (confirmed with PyYAML while writing tip.yml); nothing guarantees Forgejo's
# parser special-cases it the way GitHub's does.
"on":
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re-)release, e.g. v0.2.0"
        type: string
        required: true

# The inputs context (not github.event.inputs — Forgejo's docs list `inputs`
# as its own top-level context, not nested under github/forgejo) is what
# concurrency.group and the version step below both read.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Crash-reporter / feedback-window mail transport (`dtb-ke-ui/build.rs`'s
  # emit_smtp_secret — see mail.rs). Read at *compile* time, so this has to be
  # visible to every job that builds dtb-ke-ui, not just wherever the app
  # later runs; a top-level env applies to all of them in one place. Absent
  # secrets resolve to empty strings, which build.rs already treats as "mail
  # disabled" (see mail::available()) — never a build failure.
  DTB_KE_SMTP_HOST: ${{ secrets.DTB_KE_SMTP_HOST }}
  DTB_KE_SMTP_PORT: ${{ secrets.DTB_KE_SMTP_PORT }}
  DTB_KE_SMTP_USER: ${{ secrets.DTB_KE_SMTP_USER }}
  DTB_KE_SMTP_PASS: ${{ secrets.DTB_KE_SMTP_PASS }}
  DTB_KE_SMTP_FROM: ${{ secrets.DTB_KE_SMTP_FROM }}
  DTB_KE_SMTP_TO: ${{ secrets.DTB_KE_SMTP_TO }}

jobs:
  prepare:
    runs-on: [linux-host]
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}
      latest_release_id: ${{ steps.prepare-latest.outputs.release_id }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch submodules (shallow)
        # cargo resolves the whole workspace — including the vendored [patch] crates and
        # vendor/cargo-bundle itself — even for a plain `cargo build`. fetch-depth 0 above would
        # clone the submodules with full history, hence the explicit shallow update.
        run: git submodule update --init --depth 1
      - id: version
        name: Parse the release tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=${tag}" >> "$FORGEJO_OUTPUT"
          echo "version=${tag#v}" >> "$FORGEJO_OUTPUT"

      # release.py already wrote the release notes into the *tag message* —
      # reuse them verbatim rather than re-deriving anything here.
      # `%(contents)` would also drag in the PGP block for a signed tag
      # (`git config tag.gpgsign`), so cut everything from the signature on.
      - id: notes
        name: Read the release notes from the tag message
        run: |
          git tag -l --format='%(contents)' "${{ steps.version.outputs.tag }}" \
            | sed '/^-----BEGIN PGP SIGNATURE-----$/,$d' \
            > /tmp/release-notes.md

      - id: prepare
        name: Create/replace the version release
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          python3 scripts/codeberg.py prepare \
            --tag "${{ steps.version.outputs.tag }}" \
            --target "${{ steps.version.outputs.tag }}" \
            --title "DTB Kampfrichtereinsatzpläne ${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md \
            --draft

      # `latest` is a rolling tag — force-move it to this release's commit
      # before codeberg prepare, which never retargets an existing tag itself
      # (see tip.yml for the same pattern). The version tag needs no such
      # step: release.py already placed it exactly where it should be.
      - name: Force-move the latest tag
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://philippremy:${CODEBERG_TOKEN}@codeberg.org/philippremy/DTB-Kampfrichtereinsatzplaene.git"
          git tag -f latest "${{ steps.version.outputs.tag }}"
          git push -f origin latest

      - id: prepare-latest
        name: Create/replace the latest release
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          python3 scripts/codeberg.py prepare \
            --tag latest \
            --target "${{ steps.version.outputs.tag }}" \
            --title "Latest: ${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md \
            --draft

  linux-x86_64:
    needs: prepare
    runs-on: [linux-host]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Clean target/
        run: rm -rf target
      - name: Build unstripped + split debug info
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: off
        run: |
          set -euo pipefail
          cargo build --release -p dtb-ke-ui
          python3 scripts/symbols.py split "target/release/dtb-ke-ui" \
            --target x86_64-unknown-linux-gnu --out-dir "target/release/stripped" >/dev/null
      - name: Bundle (deb + AppImage) from the stripped binary
        # No -f: the Linux default is exactly deb+appimage (rpm isn't implemented upstream yet).
        # --binary-path skips cargo-bundle's own (unstripped) build entirely.
        run: |
          cargo cargo-bundle -p dtb-ke-ui --release \
            --binary-path "target/release/stripped/dtb-ke-ui"
      - name: Sign + package + upload
        env:
          ZIPSIGN_KEY_B64: ${{ secrets.ZIPSIGN_KEY }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          name="DTB-Kampfrichtereinsatzpläne-${{ needs.prepare.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz"
          # Renamed to match what the .deb/.AppImage now install as (linux.executable_name in
          # dtb-ke-ui/Cargo.toml) -- a manual download should give the same executable name as a
          # package-manager install.
          cp "target/release/stripped/dtb-ke-ui" "target/release/stripped/dtb-ke"
          tar -C "target/release/stripped" -czf "$name" dtb-ke
          echo "$ZIPSIGN_KEY_B64" | base64 -d > /tmp/release.priv
          zipsign sign tar "$name" /tmp/release.priv
          shred -u /tmp/release.priv 2>/dev/null || rm -f /tmp/release.priv
          python3 scripts/codeberg.py upload \
            --release-id ${{ needs.prepare.outputs.release_id }} \
            --release-id ${{ needs.prepare.outputs.latest_release_id }} \
            "$name" target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage
      - name: Upload debug symbols to the symbol server
        # The standalone .debug file split() produced, keyed by its ELF build-id.
        # --strict: a release must not ship without its symbols on the server.
        env:
          DTB_KE_SYMBOLS_URL: ${{ secrets.DTB_KE_SYMBOLS_URL }}
          DTB_KE_SYMBOLS_UPLOAD_TOKEN: ${{ secrets.DTB_KE_SYMBOLS_UPLOAD_TOKEN }}
        run: python3 scripts/symbols.py upload --auto --strict

  linux-arm64:
    needs: prepare
    runs-on: [linux-host]
    env:
      # See RUNNERS.md § Linux arm64 — same sysroot tip.yml uses.
      PKG_CONFIG_ALLOW_CROSS: "1"
      PKG_CONFIG_SYSROOT_DIR: /opt/sysroots/aarch64-linux-gnu
      PKG_CONFIG_PATH: /opt/sysroots/aarch64-linux-gnu/usr/lib/aarch64-linux-gnu/pkgconfig:/opt/sysroots/aarch64-linux-gnu/usr/share/pkgconfig
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      # See tip.yml's linux-arm64 job for why this is -L (not --sysroot) plus
      # -Wl,-rpath-link (needed on top of -L to resolve each linked .so's own
      # further DT_NEEDED chain, not just the libraries named directly).
      RUSTFLAGS: "-C link-arg=-L/opt/sysroots/aarch64-linux-gnu/usr/lib/aarch64-linux-gnu -C link-arg=-L/opt/sysroots/aarch64-linux-gnu/lib/aarch64-linux-gnu -C link-arg=-Wl,-rpath-link,/opt/sysroots/aarch64-linux-gnu/usr/lib/aarch64-linux-gnu -C link-arg=-Wl,-rpath-link,/opt/sysroots/aarch64-linux-gnu/lib/aarch64-linux-gnu"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Clean target/
        run: rm -rf target
      - name: Cross-build unstripped + split debug info
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: off
        run: |
          set -euo pipefail
          cargo build --release -p dtb-ke-ui --target aarch64-unknown-linux-gnu
          python3 scripts/symbols.py split "target/aarch64-unknown-linux-gnu/release/dtb-ke-ui" \
            --target aarch64-unknown-linux-gnu \
            --out-dir "target/aarch64-unknown-linux-gnu/release/stripped" >/dev/null
      - name: Bundle (deb + AppImage) from the stripped binary
        run: |
          cargo cargo-bundle -p dtb-ke-ui --release --target aarch64-unknown-linux-gnu \
            --binary-path "target/aarch64-unknown-linux-gnu/release/stripped/dtb-ke-ui"
      - name: Sign + package + upload
        env:
          ZIPSIGN_KEY_B64: ${{ secrets.ZIPSIGN_KEY }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          name="DTB-Kampfrichtereinsatzpläne-${{ needs.prepare.outputs.version }}-aarch64-unknown-linux-gnu.tar.gz"
          # See the linux-x86_64 job above for why this is renamed to match linux.executable_name.
          cp "target/aarch64-unknown-linux-gnu/release/stripped/dtb-ke-ui" \
            "target/aarch64-unknown-linux-gnu/release/stripped/dtb-ke"
          tar -C "target/aarch64-unknown-linux-gnu/release/stripped" -czf "$name" dtb-ke
          echo "$ZIPSIGN_KEY_B64" | base64 -d > /tmp/release.priv
          zipsign sign tar "$name" /tmp/release.priv
          shred -u /tmp/release.priv 2>/dev/null || rm -f /tmp/release.priv
          bundle_dir="target/aarch64-unknown-linux-gnu/release/bundle"
          python3 scripts/codeberg.py upload \
            --release-id ${{ needs.prepare.outputs.release_id }} \
            --release-id ${{ needs.prepare.outputs.latest_release_id }} \
            "$name" "$bundle_dir"/deb/*.deb "$bundle_dir"/appimage/*.AppImage
      - name: Upload debug symbols to the symbol server
        # --strict: a release must not ship without its symbols on the server.
        env:
          DTB_KE_SYMBOLS_URL: ${{ secrets.DTB_KE_SYMBOLS_URL }}
          DTB_KE_SYMBOLS_UPLOAD_TOKEN: ${{ secrets.DTB_KE_SYMBOLS_UPLOAD_TOKEN }}
        run: python3 scripts/symbols.py upload --auto --target aarch64-unknown-linux-gnu --strict

  windows-x86_64:
    needs: prepare
    runs-on: [windows-host]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Clean target/
        # Not shell: bash — a bare Windows Server install has no bash at all
        # (Git for Windows, which bundles one, is never installed anywhere
        # in this setup).
        run: Remove-Item -Recurse -Force target -ErrorAction SilentlyContinue
      - name: Disable CET shadow-stack enforcement for wix.exe
        # Persistent machine-wide registry policy, already set once by
        # runner-setup-windows.ps1 — re-asserted here (idempotent, cheap) as
        # a defensive measure in case it's ever reset out of band. See
        # RUNNERS.md's Windows-VM section for why this is needed at all.
        run: Set-ProcessMitigation -Name wix.exe -Disable UserShadowStack
      - name: Build unstripped + split debug info
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: off
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release -p dtb-ke-ui --target x86_64-pc-windows-gnullvm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 scripts\symbols.py split "target\x86_64-pc-windows-gnullvm\release\dtb-ke-ui.exe" `
            --target x86_64-pc-windows-gnullvm `
            --out-dir "target\x86_64-pc-windows-gnullvm\release\stripped" | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundle (wxsmsi) from the stripped binary
        # -f wxsmsi specifically (not the upstream-default WindowsMsi/WindowsBundle pair) — only the
        # dtb-ke-patches wix backend knows about our file-association metadata.
        run: |
          $ErrorActionPreference = "Stop"
          cargo cargo-bundle -p dtb-ke-ui --release --target x86_64-pc-windows-gnullvm -f wxsmsi `
            --binary-path "target\x86_64-pc-windows-gnullvm\release\stripped\dtb-ke-ui.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign + package + upload
        # Not shell: bash — no bash on this VM (see the Clean target/ step).
        env:
          ZIPSIGN_KEY_B64: ${{ secrets.ZIPSIGN_KEY }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $triple = "x86_64-pc-windows-gnullvm"
          # See tip.yml's windows-x86_64 job for why "ä" is built from its
          # code point, why the folder is spaced (updater::BIN_NAME), and why
          # the zip is built with Compress-Archive rather than `tar -a`.
          $ae = [char]0x00E4
          $folder = "DTB Kampfrichtereinsatzpl${ae}ne"
          if (Test-Path "$folder") { Remove-Item -Recurse -Force "$folder" }
          New-Item -ItemType Directory -Path "$folder" | Out-Null
          $stripped = "target\x86_64-pc-windows-gnullvm\release\stripped\dtb-ke-ui.exe"
          Copy-Item $stripped (Join-Path $folder "$folder.exe")
          $name = "DTB-Kampfrichtereinsatzpl${ae}ne-${{ needs.prepare.outputs.version }}-$triple.zip"
          Compress-Archive -Path "$folder" -DestinationPath "$name" -Force
          $keyPath = Join-Path $env:TEMP "release.priv"
          [System.IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:ZIPSIGN_KEY_B64))
          zipsign sign zip "$name" "$keyPath"
          $zipsignExit = $LASTEXITCODE
          Remove-Item -Force $keyPath
          if ($zipsignExit -ne 0) { exit $zipsignExit }
          # @(...) forces an array even for 0 or 1 matches, so the splat below
          # never injects a stray empty / backslash arg when there is no .msi
          # (which is what a bare (Get-ChildItem ...).FullName scalar/$null did).
          $msiDir = "target\x86_64-pc-windows-gnullvm\release\bundle\wxsmsi"
          $assets = @("$name") + @(Get-ChildItem "$msiDir\*.msi" -File | ForEach-Object FullName)
          python3 scripts\codeberg.py upload `
            --release-id ${{ needs.prepare.outputs.release_id }} `
            --release-id ${{ needs.prepare.outputs.latest_release_id }} `
            @assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload debug symbols to the symbol server
        # --strict: a release must not ship without its symbols on the server.
        env:
          DTB_KE_SYMBOLS_URL: ${{ secrets.DTB_KE_SYMBOLS_URL }}
          DTB_KE_SYMBOLS_UPLOAD_TOKEN: ${{ secrets.DTB_KE_SYMBOLS_UPLOAD_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          python3 scripts\symbols.py upload --auto --target x86_64-pc-windows-gnullvm --strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-arm64:
    needs: prepare
    runs-on: [windows-host]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Clean target/
        run: Remove-Item -Recurse -Force target -ErrorAction SilentlyContinue
      - name: Disable CET shadow-stack enforcement for wix.exe
        run: Set-ProcessMitigation -Name wix.exe -Disable UserShadowStack
      - name: Cross-build unstripped + split debug info
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: off
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release -p dtb-ke-ui --target aarch64-pc-windows-gnullvm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 scripts\symbols.py split "target\aarch64-pc-windows-gnullvm\release\dtb-ke-ui.exe" `
            --target aarch64-pc-windows-gnullvm `
            --out-dir "target\aarch64-pc-windows-gnullvm\release\stripped" | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundle (wxsmsi) from the stripped binary
        run: |
          $ErrorActionPreference = "Stop"
          cargo cargo-bundle -p dtb-ke-ui --release --target aarch64-pc-windows-gnullvm -f wxsmsi `
            --binary-path "target\aarch64-pc-windows-gnullvm\release\stripped\dtb-ke-ui.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign + package + upload
        # Not shell: bash — no bash on this VM (see the Clean target/ step).
        env:
          ZIPSIGN_KEY_B64: ${{ secrets.ZIPSIGN_KEY }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $triple = "aarch64-pc-windows-gnullvm"
          # See the windows-x86_64 job above for why "ä" is built from its
          # code point rather than typed literally, and why the zip is built
          # with Compress-Archive rather than `tar -a` (bsdtar).
          $ae = [char]0x00E4
          $folder = "DTB Kampfrichtereinsatzpl${ae}ne"
          if (Test-Path "$folder") { Remove-Item -Recurse -Force "$folder" }
          New-Item -ItemType Directory -Path "$folder" | Out-Null
          $stripped = "target\aarch64-pc-windows-gnullvm\release\stripped\dtb-ke-ui.exe"
          Copy-Item $stripped (Join-Path $folder "$folder.exe")
          $name = "DTB-Kampfrichtereinsatzpl${ae}ne-${{ needs.prepare.outputs.version }}-$triple.zip"
          Compress-Archive -Path "$folder" -DestinationPath "$name" -Force
          $keyPath = Join-Path $env:TEMP "release.priv"
          [System.IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:ZIPSIGN_KEY_B64))
          zipsign sign zip "$name" "$keyPath"
          $zipsignExit = $LASTEXITCODE
          Remove-Item -Force $keyPath
          if ($zipsignExit -ne 0) { exit $zipsignExit }
          # @(...) forces an array; see the windows-x86_64 job above.
          $msiDir = "target\aarch64-pc-windows-gnullvm\release\bundle\wxsmsi"
          $assets = @("$name") + @(Get-ChildItem "$msiDir\*.msi" -File | ForEach-Object FullName)
          python3 scripts\codeberg.py upload `
            --release-id ${{ needs.prepare.outputs.release_id }} `
            --release-id ${{ needs.prepare.outputs.latest_release_id }} `
            @assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload debug symbols to the symbol server
        # --strict: a release must not ship without its symbols on the server.
        env:
          DTB_KE_SYMBOLS_URL: ${{ secrets.DTB_KE_SYMBOLS_URL }}
          DTB_KE_SYMBOLS_UPLOAD_TOKEN: ${{ secrets.DTB_KE_SYMBOLS_UPLOAD_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          python3 scripts\symbols.py upload --auto --target aarch64-pc-windows-gnullvm --strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  macos-universal:
    needs: prepare
    runs-on: [macos-host]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Clean target/
        run: rm -rf target
      - name: Build + sign universal binary
        # A real Developer ID + notarization is the good path (Gatekeeper
        # trusts the result outright on relaunch — see UPDATER.md), but this
        # app's user base is small enough that ad-hoc is an accepted
        # fallback: unsigned is the only thing that's actually a no-go. No -f
        # here (unlike Tip's macos-universal job): the OS default for macOS is
        # exactly osx+dmg together, which is what a real release wants.
        # apple_signing_p12/apple_signing_password_env (dtb-ke-ui's own
        # [package.metadata.bundle.osx], unset today) is how a real
        # Developer ID cert would be wired in; with neither set,
        # signing.rs's sign_apple_path falls back to ad-hoc automatically —
        # the in-app updater already tolerates an ad-hoc macOS build (it just
        # costs a first-run Gatekeeper prompt, same as the Tip channel).
        run: cargo cargo-bundle -p dtb-ke-ui --release --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Notarize
        if: ${{ secrets.MACOS_SIGN_IDENTITY != '' }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_B64: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          app="target/universal/release/bundle/osx/DTB Kampfrichtereinsatzpläne.app"
          mkdir -p /tmp/apikey && echo "$APPLE_API_KEY_P8_B64" | base64 -d > "/tmp/apikey/AuthKey_${APPLE_API_KEY_ID}.p8"
          zip -qr /tmp/notarize.zip "$app"
          xcrun notarytool submit /tmp/notarize.zip \
            --key "/tmp/apikey/AuthKey_${APPLE_API_KEY_ID}.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$app"
          rm -rf /tmp/apikey /tmp/notarize.zip
      - name: Sign + package + upload
        env:
          ZIPSIGN_KEY_B64: ${{ secrets.ZIPSIGN_KEY }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          bundle_dir="target/universal/release/bundle/osx"
          name="DTB-Kampfrichtereinsatzpläne-${{ needs.prepare.outputs.version }}-universal-apple-darwin.tar.gz"
          # -C rather than staging a renamed copy first — the archive's
          # top-level entry is the .app exactly as cargo-bundle built it
          # (updater::BIN_NAME, spaced), matching what the updater expects
          # to find inside the downloaded archive.
          tar -C "$bundle_dir" -czf "$name" "DTB Kampfrichtereinsatzpläne.app"
          echo "$ZIPSIGN_KEY_B64" | base64 -d > /tmp/release.priv
          zipsign sign tar "$name" /tmp/release.priv
          shred -u /tmp/release.priv 2>/dev/null || rm -f /tmp/release.priv
          python3 scripts/codeberg.py upload \
            --release-id ${{ needs.prepare.outputs.release_id }} \
            --release-id ${{ needs.prepare.outputs.latest_release_id }} \
            "$name" target/universal/release/bundle/dmg/*.dmg
      - name: Upload debug symbols to the symbol server
        # The merged universal dSYM's DWARF file, once per slice id.
        # --strict: a release must not ship without its symbols on the server.
        env:
          DTB_KE_SYMBOLS_URL: ${{ secrets.DTB_KE_SYMBOLS_URL }}
          DTB_KE_SYMBOLS_UPLOAD_TOKEN: ${{ secrets.DTB_KE_SYMBOLS_UPLOAD_TOKEN }}
        run: python3 scripts/symbols.py upload --auto --universal --strict

  ios:
    needs: prepare
    runs-on: [macos-host]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Clean target/
        run: rm -rf target
      - name: Build the iOS app + .ipa
        # See tip.yml's ios job — same device-signing (keychain identity + embedded provisioning
        # profile, vendor/cargo-bundle's own, no external Apple binaries) and .ipa packaging.
        env:
          IOS_SIGN_IDENTITY: ${{ secrets.IOS_SIGN_IDENTITY }}
          IOS_PROVISIONING_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          args=(-p dtb-ke-ui --release --target aarch64-apple-ios -f ios)
          if [ -n "$IOS_SIGN_IDENTITY" ] && [ -n "$IOS_PROVISIONING_PROFILE_B64" ]; then
            profile="$(mktemp -t dtbke-profile).mobileprovision"
            echo "$IOS_PROVISIONING_PROFILE_B64" | base64 -d > "$profile"
            args+=(--sign "$IOS_SIGN_IDENTITY" --provisioning-profile "$profile")
          else
            echo "::warning::IOS_SIGN_IDENTITY / IOS_PROVISIONING_PROFILE not set — building ad-hoc signed (not installable on a device)." >&2
          fi
          cargo cargo-bundle "${args[@]}"
      - name: Package + upload
        # --plain: no manifest fragment, so the in-app updater (which has no iOS channel at all —
        # updater::supported() is false there) never sees these; they are for manual install /
        # TestFlight / sideloading.
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          bundle_dir="target/aarch64-apple-ios/release/bundle/ios"
          base="DTB-Kampfrichtereinsatzpläne-${{ needs.prepare.outputs.version }}-aarch64-apple-ios"
          cp "$bundle_dir/DTB Kampfrichtereinsatzpläne.ipa" "$base.ipa"
          tar -C "$bundle_dir" -czf "$base.app.tar.gz" "DTB Kampfrichtereinsatzpläne.app"
          python3 scripts/codeberg.py upload --plain \
            --release-id ${{ needs.prepare.outputs.release_id }} \
            --release-id ${{ needs.prepare.outputs.latest_release_id }} \
            "$base.ipa" "$base.app.tar.gz"

      - name: Upload debug symbols to the symbol server
        # The iOS crash reporter records only image UUIDs + offsets; the dSYM on the server symbolicates them.
        # --strict: a release must not ship without its symbols on the server.
        env:
          DTB_KE_SYMBOLS_URL: ${{ secrets.DTB_KE_SYMBOLS_URL }}
          DTB_KE_SYMBOLS_UPLOAD_TOKEN: ${{ secrets.DTB_KE_SYMBOLS_UPLOAD_TOKEN }}
        run: python3 scripts/symbols.py upload --auto --target aarch64-apple-ios --strict

  publish:
    needs:
      - prepare
      - linux-x86_64
      - linux-arm64
      - windows-x86_64
      - windows-arm64
      - macos-universal
    runs-on: [linux-host]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Publish the release manifest
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          for id in ${{ needs.prepare.outputs.release_id }} ${{ needs.prepare.outputs.latest_release_id }}; do
            python3 scripts/codeberg.py manifest-publish \
              --release-id "$id" \
              --version "${{ needs.prepare.outputs.version }}" \
              --date "$(date -u +%Y-%m-%d)" \
              --notes-url "https://codeberg.org/philippremy/DTB-Kampfrichtereinsatzplaene/releases/tag/${{ needs.prepare.outputs.tag }}" \
              --publish
          done
