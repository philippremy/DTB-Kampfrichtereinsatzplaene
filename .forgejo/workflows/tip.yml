name: Tip

# Every push to main → one rolling "tip" release, replaced each run. See
# UPDATER.md for the manifest/versioning scheme and RUNNERS.md for what each
# `runs-on` label actually is.
#
# Bundling goes through `cargo cargo-bundle` (vendor/cargo-bundle, a fork —
# see vendor/README.md; the old in-tree `dtb-ke-bundle` crate is gone) plus
# `scripts/*.py` for everything that isn't platform packaging (codeberg
# release management, debug-info splitting, symbol upload, the manifest).
# Every runner needs `python3` on PATH (see scripts/README-equivalent notes
# in CLAUDE.md's Commands section) in addition to the tools RUNNERS.md
# already lists.
#
# Linux and Windows-gnullvm release builds keep the debug info out of the
# shipped binary the same way the old `dtb-ke-bundle bundle` used to do it
# transparently: build unstripped (`CARGO_PROFILE_RELEASE_STRIP=none`,
# `CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO=off`), split with
# `scripts/symbols.py split` (objcopy/llvm-strip, verifies the debug id
# survives), then hand the *stripped* copy to `cargo cargo-bundle
# --binary-path` so it never builds its own (unstripped) binary. macOS/iOS
# need none of this — `[profile.release] split-debuginfo = "packed"`
# (workspace Cargo.toml) already ships a stripped binary + a `.dSYM`
# automatically, same as ever.
#
# "on" is quoted below — bare `on:` parses as the *boolean* `true` under
# YAML 1.1 (the "Norway problem"; confirmed with PyYAML while writing this).
# GitHub's own parser special-cases it, but nothing guarantees Forgejo's does,
# so this file doesn't rely on that.
"on":
  push:
    branches: [main]

concurrency:
  group: tip
  # Queue, don't cancel: Tip is this project's CI — every push should still
  # get a real pass/fail verdict, not have its build cut short because
  # another push landed first. Runs in this group now queue in order instead.
  cancel-in-progress: false

env:
  # Speed over size: no LTO, more codegen units, and (critically, since these
  # are persistent self-hosted runners that never wipe `target/` here) real
  # incremental compilation between commits. Release builds don't set any of
  # this — they always start from a clean target/ with the workspace's normal
  # profile (fat LTO, codegen-units = 1). See CLAUDE.md's binary-size memory.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_INCREMENTAL: "1"
  # Crash-reporter / feedback-window mail transport (`dtb-ke-ui/build.rs`'s
  # emit_smtp_secret — see mail.rs). Read at *compile* time, so this has to be
  # visible to every job that builds dtb-ke-ui, not just wherever the app
  # later runs; a top-level env applies to all of them in one place. Absent
  # secrets resolve to empty strings, which build.rs already treats as "mail
  # disabled" (see mail::available()) — never a build failure.
  DTB_KE_SMTP_HOST: ${{ secrets.DTB_KE_SMTP_HOST }}
  DTB_KE_SMTP_PORT: ${{ secrets.DTB_KE_SMTP_PORT }}
  DTB_KE_SMTP_USER: ${{ secrets.DTB_KE_SMTP_USER }}
  DTB_KE_SMTP_PASS: ${{ secrets.DTB_KE_SMTP_PASS }}
  DTB_KE_SMTP_FROM: ${{ secrets.DTB_KE_SMTP_FROM }}
  DTB_KE_SMTP_TO: ${{ secrets.DTB_KE_SMTP_TO }}

jobs:
  prepare:
    runs-on: [linux-host]
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # `git rev-list --count vX.Y.Z..HEAD` (below) needs the full history
          # and the release tags. The five build jobs stay shallow — they only
          # consume `needs.prepare.outputs.version`.
          fetch-depth: 0
          fetch-tags: true

      # Forgejo's real contexts are forgejo/forge, github (an alias of
      - name: Fetch submodules (shallow)
        # cargo resolves the whole workspace — including the vendored [patch] crates and
        # vendor/cargo-bundle itself (its own, separate workspace, excluded from ours but still a
        # submodule that has to physically exist for the `cargo cargo-bundle` alias to find its
        # Cargo.toml) — even for a plain `cargo build`. fetch-depth 0 above would clone the
        # submodules with full history, hence the explicit shallow update.
        run: git submodule update --init --depth 1
      # forgejo, for GH-Actions-compatible expressions), secrets, vars, env,
      # matrix, steps, needs, inputs, runner — there is no "gitea" context
      # (confirmed against forgejo.org/docs/latest/user/actions/reference/
      # after this file failed schema validation with exactly that mistake).
      - id: version
        name: Compute the Tip version
        run: |
          # `Cargo.toml` sits at `X.Y.(Z+1)-dev.0` between releases (set by
          # scripts/release.py); strip the `-dev.0` to get the base.
          raw=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          base=${raw%-dev.*}
          # `-dev.N`, N = commits on main since the last release tag (or since
          # the root before the first release). Monotonic, resets per release,
          # derived from history so there's no counter to store or bump.
          # self_update compares digit-only prerelease identifiers numerically.
          last=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -n "$last" ]; then
            n=$(git rev-list --count --first-parent "${last}..HEAD")
          else
            n=$(git rev-list --count --first-parent HEAD)
          fi
          echo "version=${base}-dev.${n}" >> "$FORGEJO_OUTPUT"

      # A release API can create a tag that doesn't exist yet, but never
      # retargets one that does — so force-move `tip` ourselves first.
      # codeberg prepare (next step) then only has to replace the release
      # object, never the tag.
      - name: Force-move the tip tag
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://philippremy:${CODEBERG_TOKEN}@codeberg.org/philippremy/DTB-Kampfrichtereinsatzplaene.git"
          git tag -f tip
          git push -f origin tip

      # scripts/codeberg.py writes `release_id=<id>` to $FORGEJO_OUTPUT itself (as well as stdout) —
      # no separate `>> "$FORGEJO_OUTPUT"` capture needed here.
      - id: prepare
        name: Create/replace the tip release
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          printf 'Automatic build of %s\n\n%s\n' \
            "$(git log -1 --format='%h — %s')" \
            "Ad-hoc signed only, not notarized — installs in place on every platform, including macOS; expect a first-run Gatekeeper prompt there." \
            > /tmp/tip-notes.md
          python3 scripts/codeberg.py prepare \
            --tag tip \
            --target "${{ github.sha }}" \
            --title "DTB Kampfrichtereinsatzpläne (Tip; ${{ steps.version.outputs.version }})" \
            --notes-file /tmp/tip-notes.md \
            --prerelease

  linux-x86_64:
    needs: prepare
    runs-on: [linux-host]
    env:
      # Forgejo checks each job out into a fresh, random per-job directory
      # (see RUNNERS.md § target-dir caching) — without an absolute, fixed
      # CARGO_TARGET_DIR, "persistent target-folder caching" would silently
      # do nothing, since the relative ./target from the last run is gone.
      # Pre-created (and owned by the runner user) by runner-setup-linux.sh.
      CARGO_TARGET_DIR: /var/cache/Codeberg/DTB-Kampfrichtereinsatzplaene/Cache/tip/x86_64-unknown-linux-gnu
      DTB_KE_VERSION: ${{ needs.prepare.outputs.version }}  # baked into the binary so the updater sees Tip builds as distinct
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Build unstripped + split debug info
        # Tip skips packaging entirely (no .deb/.AppImage — those are release.yml's job); this job
        # only ever needs the raw, split, stripped binary for the updater's portable archive.
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: off
        run: |
          set -euo pipefail
          cargo build --release -p dtb-ke-ui
          python3 scripts/symbols.py split "$CARGO_TARGET_DIR/release/dtb-ke-ui" \
            --target x86_64-unknown-linux-gnu --out-dir "$CARGO_TARGET_DIR/release/stripped" >/dev/null
      - name: Package + upload
        env:
          ZIPSIGN_KEY_B64: ${{ secrets.ZIPSIGN_KEY }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          name="DTB-Kampfrichtereinsatzpläne-${{ needs.prepare.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz"
          # Renamed to match what the .deb/.AppImage install as (linux.executable_name in
          # dtb-ke-ui/Cargo.toml) -- a manual download should give the same executable name as a
          # package-manager install.
          cp "$CARGO_TARGET_DIR/release/stripped/dtb-ke-ui" "$CARGO_TARGET_DIR/release/stripped/dtb-ke"
          tar -C "$CARGO_TARGET_DIR/release/stripped" -czf "$name" dtb-ke
          # Tip archives are zipsign-signed too — the app requires a valid
          # signature on both channels (see UPDATER.md).
          echo "$ZIPSIGN_KEY_B64" | base64 -d > /tmp/release.priv
          zipsign sign tar "$name" /tmp/release.priv
          shred -u /tmp/release.priv 2>/dev/null || rm -f /tmp/release.priv
          python3 scripts/codeberg.py upload --release-id ${{ needs.prepare.outputs.release_id }} "$name"
      - name: Upload debug symbols to the symbol server
        # The standalone .debug file split() produced, keyed by its ELF build-id.
        # Best effort: a symbol-server outage must not fail a Tip build.
        env:
          DTB_KE_SYMBOLS_URL: ${{ secrets.DTB_KE_SYMBOLS_URL }}
          DTB_KE_SYMBOLS_UPLOAD_TOKEN: ${{ secrets.DTB_KE_SYMBOLS_UPLOAD_TOKEN }}
        run: python3 scripts/symbols.py upload --auto

  linux-arm64:
    needs: prepare
    runs-on: [linux-host]
    env:
      # See RUNNERS.md § Linux arm64 for how this sysroot was assembled
      # (extracted Debian aarch64 .debs — no QEMU, nothing foreign-arch ever
      # executed) and why fontconfig/freetype/wayland/EGL are the only real
      # cross-link risk in this dependency tree.
      # Fixed absolute path so incremental caching survives the ephemeral
      # per-job checkout — see the linux-x86_64 job above / RUNNERS.md.
      CARGO_TARGET_DIR: /var/cache/Codeberg/DTB-Kampfrichtereinsatzplaene/Cache/tip/aarch64-unknown-linux-gnu
      DTB_KE_VERSION: ${{ needs.prepare.outputs.version }}  # baked into the binary so the updater sees Tip builds as distinct
      PKG_CONFIG_ALLOW_CROSS: "1"
      PKG_CONFIG_SYSROOT_DIR: /opt/sysroots/aarch64-linux-gnu
      PKG_CONFIG_PATH: /opt/sysroots/aarch64-linux-gnu/usr/lib/aarch64-linux-gnu/pkgconfig:/opt/sysroots/aarch64-linux-gnu/usr/share/pkgconfig
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      # NOT --sysroot=/opt/sysroots/... — gcc already has a correct default
      # sysroot (/usr/aarch64-linux-gnu, where the aarch64-linux-gnu-glibc
      # pacman package puts libc/libm/etc.) baked in by the Arch package;
      # --sysroot would *replace* that default wholesale rather than add to
      # it, breaking glibc resolution entirely (confirmed against a real
      # failure: `ld: cannot find /lib/libm.so.6: file in wrong format` — it
      # fell through to the host's own /lib). -L instead, additive, pointing
      # at the two multiarch dirs our extracted sysroot's libraries actually
      # landed in (Debian's usr/lib vs lib split — see RUNNERS.md).
      #
      # -L alone isn't enough either: it only covers libraries the linker is
      # told to find directly (-lfontconfig etc.) — it does NOT search -L
      # paths to resolve *those* libraries' own further DT_NEEDED chain
      # (confirmed against a real failure: ld warned "libexpat.so.1, needed
      # by libfontconfig.so, not found" even though libexpat.so.1 was right
      # there on an -L path, then failed for real with "undefined reference
      # to XML_SetUserData" etc.). -Wl,-rpath-link is the flag that actually
      # covers indirect/transitive resolution at link time.
      RUSTFLAGS: "-C link-arg=-L/opt/sysroots/aarch64-linux-gnu/usr/lib/aarch64-linux-gnu -C link-arg=-L/opt/sysroots/aarch64-linux-gnu/lib/aarch64-linux-gnu -C link-arg=-Wl,-rpath-link,/opt/sysroots/aarch64-linux-gnu/usr/lib/aarch64-linux-gnu -C link-arg=-Wl,-rpath-link,/opt/sysroots/aarch64-linux-gnu/lib/aarch64-linux-gnu"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Cross-build unstripped + split debug info
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: off
        run: |
          set -euo pipefail
          cargo build --release -p dtb-ke-ui --target aarch64-unknown-linux-gnu
          python3 scripts/symbols.py split "$CARGO_TARGET_DIR/aarch64-unknown-linux-gnu/release/dtb-ke-ui" \
            --target aarch64-unknown-linux-gnu \
            --out-dir "$CARGO_TARGET_DIR/aarch64-unknown-linux-gnu/release/stripped" >/dev/null
      - name: Package + upload
        env:
          ZIPSIGN_KEY_B64: ${{ secrets.ZIPSIGN_KEY }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          name="DTB-Kampfrichtereinsatzpläne-${{ needs.prepare.outputs.version }}-aarch64-unknown-linux-gnu.tar.gz"
          # See the linux-x86_64 job above for why this is renamed to match linux.executable_name.
          cp "$CARGO_TARGET_DIR/aarch64-unknown-linux-gnu/release/stripped/dtb-ke-ui" \
            "$CARGO_TARGET_DIR/aarch64-unknown-linux-gnu/release/stripped/dtb-ke"
          tar -C "$CARGO_TARGET_DIR/aarch64-unknown-linux-gnu/release/stripped" -czf "$name" dtb-ke
          echo "$ZIPSIGN_KEY_B64" | base64 -d > /tmp/release.priv
          zipsign sign tar "$name" /tmp/release.priv
          shred -u /tmp/release.priv 2>/dev/null || rm -f /tmp/release.priv
          python3 scripts/codeberg.py upload --release-id ${{ needs.prepare.outputs.release_id }} "$name"
      - name: Upload debug symbols to the symbol server
        # The standalone .debug file split() produced, keyed by its ELF build-id.
        # Best effort: a symbol-server outage must not fail a Tip build.
        env:
          DTB_KE_SYMBOLS_URL: ${{ secrets.DTB_KE_SYMBOLS_URL }}
          DTB_KE_SYMBOLS_UPLOAD_TOKEN: ${{ secrets.DTB_KE_SYMBOLS_UPLOAD_TOKEN }}
        run: python3 scripts/symbols.py upload --auto --target aarch64-unknown-linux-gnu

  windows-x86_64:
    needs: prepare
    runs-on: [windows-host]
    env:
      # Same reasoning as the Linux jobs — fixed, pre-created by
      # runner-setup-windows.ps1. Backslashes, not forward slashes: most
      # Windows path APIs accept either, but gpui_windows's build.rs passes
      # this straight through to fxc.exe (classic /switch-style MSVC
      # toolchain argument parsing), which choked on an embedded forward
      # slash with "The filename, directory name, or volume label syntax is
      # incorrect" (error 123) — a plain, unquoted YAML scalar preserves
      # backslashes literally (verified with PyYAML), so no escaping is
      # needed for this either way.
      CARGO_TARGET_DIR: C:\Codeberg\DTB-Kampfrichtereinsatzplaene\Cache\tip\x86_64-pc-windows-gnullvm
      DTB_KE_VERSION: ${{ needs.prepare.outputs.version }}  # baked into the binary so the updater sees Tip builds as distinct
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Build unstripped + split debug info
        # Not shell: bash — a bare Windows Server install has no bash at all
        # (Git for Windows, which bundles one, is never installed anywhere
        # in this setup) — native PowerShell throughout instead.
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: off
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release -p dtb-ke-ui --target x86_64-pc-windows-gnullvm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 scripts\symbols.py split "$env:CARGO_TARGET_DIR\x86_64-pc-windows-gnullvm\release\dtb-ke-ui.exe" `
            --target x86_64-pc-windows-gnullvm `
            --out-dir "$env:CARGO_TARGET_DIR\x86_64-pc-windows-gnullvm\release\stripped" | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package + upload
        env:
          ZIPSIGN_KEY_B64: ${{ secrets.ZIPSIGN_KEY }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $triple = "x86_64-pc-windows-gnullvm"
          # "ä" is built from its code point, not typed literally — Windows
          # Server only ships Windows PowerShell 5.1, which (unlike pwsh 7)
          # reads a script file with no UTF-8 BOM using the system's ANSI
          # code page: whatever encoding Forgejo's runner actually wrote the
          # composited step script in, a literal "ä" here previously came out
          # as raw mis-decoded bytes (confirmed against a real release: the
          # asset showed up on Codeberg as "...KampfrichtereinsatzplÃ¤ne...").
          # [char]0x00E4 is plain ASCII in the script source, so it can't be
          # misread regardless of the file's actual encoding or which
          # PowerShell reads it.
          $ae = [char]0x00E4
          # Spaced, matching updater::BIN_NAME — self_update's Windows
          # bin_path_in_archive has to find this exact "folder/exe" path
          # inside the downloaded archive.
          $folder = "DTB Kampfrichtereinsatzpl${ae}ne"
          if (Test-Path "$folder") { Remove-Item -Recurse -Force "$folder" }
          New-Item -ItemType Directory -Path "$folder" | Out-Null
          $stripped = "$env:CARGO_TARGET_DIR\x86_64-pc-windows-gnullvm\release\stripped\dtb-ke-ui.exe"
          Copy-Item $stripped (Join-Path $folder "$folder.exe")
          $name = "DTB-Kampfrichtereinsatzpl${ae}ne-${{ needs.prepare.outputs.version }}-$triple.zip"
          # Compress-Archive (.NET's ZipArchive), not `tar -a` (bsdtar):
          # bsdtar wrote the folder's non-ASCII entry name into the zip
          # without the UTF-8 language-encoding flag, so *any* extractor that
          # falls back to a legacy code page for unflagged entries (confirmed
          # against a real download: the .exe came out named
          # "...Kampfrichtereinsatzpl„ne.exe") mangled it on extraction.
          # ZipArchive sets that flag correctly for a non-ASCII entry name.
          Compress-Archive -Path "$folder" -DestinationPath "$name" -Force
          # Tip archives are zipsign-signed too — the app requires a valid
          # signature on both channels (see UPDATER.md).
          $keyPath = Join-Path $env:TEMP "release.priv"
          [System.IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:ZIPSIGN_KEY_B64))
          zipsign sign zip "$name" "$keyPath"
          $zipsignExit = $LASTEXITCODE
          Remove-Item -Force $keyPath
          if ($zipsignExit -ne 0) { exit $zipsignExit }
          python3 scripts\codeberg.py upload --release-id ${{ needs.prepare.outputs.release_id }} "$name"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload debug symbols to the symbol server
        # The PE debug file split() produced (or, if llvm-objcopy couldn't split one off, the
        # unstripped executable itself — symbols.py's --auto resolves whichever exists).
        # Best effort: a symbol-server outage must not fail a Tip build.
        env:
          DTB_KE_SYMBOLS_URL: ${{ secrets.DTB_KE_SYMBOLS_URL }}
          DTB_KE_SYMBOLS_UPLOAD_TOKEN: ${{ secrets.DTB_KE_SYMBOLS_UPLOAD_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          python3 scripts\symbols.py upload --auto --target x86_64-pc-windows-gnullvm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-arm64:
    needs: prepare
    runs-on: [windows-host]
    env:
      # See the windows-x86_64 job above for why this is backslashes, not
      # forward slashes.
      CARGO_TARGET_DIR: C:\Codeberg\DTB-Kampfrichtereinsatzplaene\Cache\tip\aarch64-pc-windows-gnullvm
      DTB_KE_VERSION: ${{ needs.prepare.outputs.version }}  # baked into the binary so the updater sees Tip builds as distinct
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Cross-build unstripped + split debug info
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: off
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release -p dtb-ke-ui --target aarch64-pc-windows-gnullvm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 scripts\symbols.py split "$env:CARGO_TARGET_DIR\aarch64-pc-windows-gnullvm\release\dtb-ke-ui.exe" `
            --target aarch64-pc-windows-gnullvm `
            --out-dir "$env:CARGO_TARGET_DIR\aarch64-pc-windows-gnullvm\release\stripped" | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package + upload
        env:
          ZIPSIGN_KEY_B64: ${{ secrets.ZIPSIGN_KEY }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $triple = "aarch64-pc-windows-gnullvm"
          # See the windows-x86_64 job above for why "ä" is built from its
          # code point rather than typed literally, and why the zip is built
          # with Compress-Archive rather than `tar -a` (bsdtar).
          $ae = [char]0x00E4
          $folder = "DTB Kampfrichtereinsatzpl${ae}ne"
          if (Test-Path "$folder") { Remove-Item -Recurse -Force "$folder" }
          New-Item -ItemType Directory -Path "$folder" | Out-Null
          $stripped = "$env:CARGO_TARGET_DIR\aarch64-pc-windows-gnullvm\release\stripped\dtb-ke-ui.exe"
          Copy-Item $stripped (Join-Path $folder "$folder.exe")
          $name = "DTB-Kampfrichtereinsatzpl${ae}ne-${{ needs.prepare.outputs.version }}-$triple.zip"
          Compress-Archive -Path "$folder" -DestinationPath "$name" -Force
          $keyPath = Join-Path $env:TEMP "release.priv"
          [System.IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:ZIPSIGN_KEY_B64))
          zipsign sign zip "$name" "$keyPath"
          $zipsignExit = $LASTEXITCODE
          Remove-Item -Force $keyPath
          if ($zipsignExit -ne 0) { exit $zipsignExit }
          python3 scripts\codeberg.py upload --release-id ${{ needs.prepare.outputs.release_id }} "$name"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload debug symbols to the symbol server
        env:
          DTB_KE_SYMBOLS_URL: ${{ secrets.DTB_KE_SYMBOLS_URL }}
          DTB_KE_SYMBOLS_UPLOAD_TOKEN: ${{ secrets.DTB_KE_SYMBOLS_UPLOAD_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          python3 scripts\symbols.py upload --auto --target aarch64-pc-windows-gnullvm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  macos-universal:
    needs: prepare
    runs-on: [macos-host]
    env:
      # --target passed twice below builds both apple-darwin slices under this one dir (cargo
      # already segregates them into <dir>/universal/release/ itself) — one path covers the whole
      # job. Pre-created by runner-setup-macos.sh.
      CARGO_TARGET_DIR: /Users/Shared/Codeberg/DTB-Kampfrichtereinsatzplaene/Cache/tip/universal-apple-darwin
      DTB_KE_VERSION: ${{ needs.prepare.outputs.version }}  # baked into the binary so the updater sees Tip builds as distinct
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Build universal binary
        # cargo-bundle already ad-hoc-signs the .app itself (signing.rs's sign_apple_path, always
        # signs — ad-hoc when no keychain identity/p12 is configured, as here); no separate signing
        # step needed on top of that. -f osx only (not the OS default osx+dmg pair) — Tip has no use
        # for a .dmg, only the raw .app for the updater's own archive.
        run: cargo cargo-bundle -p dtb-ke-ui --release --target aarch64-apple-darwin --target x86_64-apple-darwin -f osx
      - name: Package + upload
        env:
          ZIPSIGN_KEY_B64: ${{ secrets.ZIPSIGN_KEY }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          bundle_dir="$CARGO_TARGET_DIR/universal/release/bundle/osx"
          name="DTB-Kampfrichtereinsatzpläne-${{ needs.prepare.outputs.version }}-universal-apple-darwin.tar.gz"
          # -C rather than staging a renamed copy first — the archive's
          # top-level entry is the .app exactly as cargo-bundle built it
          # (updater::BIN_NAME, spaced), matching what the updater expects
          # to find inside the downloaded archive.
          tar -C "$bundle_dir" -czf "$name" "DTB Kampfrichtereinsatzpläne.app"
          # Tip archives are zipsign-signed too — the app requires a valid
          # signature on both channels (see UPDATER.md).
          echo "$ZIPSIGN_KEY_B64" | base64 -d > /tmp/release.priv
          zipsign sign tar "$name" /tmp/release.priv
          shred -u /tmp/release.priv 2>/dev/null || rm -f /tmp/release.priv
          python3 scripts/codeberg.py upload --release-id ${{ needs.prepare.outputs.release_id }} "$name"
      - name: Upload debug symbols to the symbol server
        # The merged universal dSYM's DWARF file, once per slice id.
        # Best effort: a symbol-server outage must not fail a Tip build.
        env:
          DTB_KE_SYMBOLS_URL: ${{ secrets.DTB_KE_SYMBOLS_URL }}
          DTB_KE_SYMBOLS_UPLOAD_TOKEN: ${{ secrets.DTB_KE_SYMBOLS_UPLOAD_TOKEN }}
        run: python3 scripts/symbols.py upload --auto --universal

  ios:
    needs: prepare
    runs-on: [macos-host]
    env:
      CARGO_TARGET_DIR: /Users/Shared/Codeberg/DTB-Kampfrichtereinsatzplaene/Cache/tip/aarch64-apple-ios
      DTB_KE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Build the iOS app + .ipa
        # Signs a real device build when IOS_SIGN_IDENTITY + IOS_PROVISIONING_PROFILE are both set (a
        # codesigning identity already in the runner's keychain + a base64 .mobileprovision);
        # otherwise cargo-bundle falls back to ad-hoc, which an iPad refuses to install but which
        # keeps the artifacts buildable. Both the device-signing (keychain identity + embedded
        # provisioning profile) and .ipa packaging are vendor/cargo-bundle's own
        # (ios_bundle.rs/signing.rs, dtb-ke-patches) — no `security`/`codesign` shelled out to.
        env:
          IOS_SIGN_IDENTITY: ${{ secrets.IOS_SIGN_IDENTITY }}
          IOS_PROVISIONING_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          args=(-p dtb-ke-ui --release --target aarch64-apple-ios -f ios)
          if [ -n "$IOS_SIGN_IDENTITY" ] && [ -n "$IOS_PROVISIONING_PROFILE_B64" ]; then
            profile="$(mktemp -t dtbke-profile).mobileprovision"
            echo "$IOS_PROVISIONING_PROFILE_B64" | base64 -d > "$profile"
            args+=(--sign "$IOS_SIGN_IDENTITY" --provisioning-profile "$profile")
          else
            echo "::warning::IOS_SIGN_IDENTITY / IOS_PROVISIONING_PROFILE not set — building ad-hoc signed (not installable on a device)." >&2
          fi
          cargo cargo-bundle "${args[@]}"
      - name: Package + upload
        # --plain: no manifest fragment, so the in-app updater (which only reads the manifest, and
        # doesn't support iOS at all — updater::supported() is false there) never sees these; they
        # are for manual install / TestFlight / sideloading.
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          bundle_dir="$CARGO_TARGET_DIR/aarch64-apple-ios/release/bundle/ios"
          base="DTB-Kampfrichtereinsatzpläne-${{ needs.prepare.outputs.version }}-aarch64-apple-ios"
          cp "$bundle_dir/DTB Kampfrichtereinsatzpläne.ipa" "$base.ipa"
          tar -C "$bundle_dir" -czf "$base.app.tar.gz" "DTB Kampfrichtereinsatzpläne.app"
          python3 scripts/codeberg.py upload --plain \
            --release-id ${{ needs.prepare.outputs.release_id }} \
            "$base.ipa" "$base.app.tar.gz"

      - name: Upload debug symbols to the symbol server
        # The iOS crash reporter records only image UUIDs + offsets; the dSYM on the server symbolicates them.
        # Best effort: a symbol-server outage must not fail a Tip build.
        env:
          DTB_KE_SYMBOLS_URL: ${{ secrets.DTB_KE_SYMBOLS_URL }}
          DTB_KE_SYMBOLS_UPLOAD_TOKEN: ${{ secrets.DTB_KE_SYMBOLS_UPLOAD_TOKEN }}
        run: python3 scripts/symbols.py upload --auto --target aarch64-apple-ios

  publish:
    needs:
      - prepare
      - linux-x86_64
      - linux-arm64
      - windows-x86_64
      - windows-arm64
      - macos-universal
    runs-on: [linux-host]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Publish the release manifest
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          python3 scripts/codeberg.py manifest-publish \
            --release-id ${{ needs.prepare.outputs.release_id }} \
            --version "${{ needs.prepare.outputs.version }}" \
            --date "$(date -u +%Y-%m-%d)" \
            --notes-url "https://codeberg.org/philippremy/DTB-Kampfrichtereinsatzplaene/releases/tag/tip" \
            --publish
